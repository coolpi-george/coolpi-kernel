default coolpi_rk3588_gbook

label coolpi_rk3588s_cp4b
	kernel /Image
	initrd /initrd.img
	fdt    /rk3588s-cp4.dtb
	append root=LABEL=writable rw rootfstype=ext4 console=ttyS0,115200n81 splash plymouth.ignore-serial-consoles vt.global_cursor_default=1 irqchip.gicv3_pseudo_nmi=0 net.ifnames=0
	
